<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080e16" />
    <style>html[data-home-intro="boot"]::before{content:"";position:fixed;inset:0;background:#000;z-index:1100;pointer-events:none}</style>
    <script>
      // Avoid a flash of the homepage before its first-visit brand arrival.
      // With JavaScript unavailable there is no curtain; slow/failed hydration
      // also releases it automatically instead of blocking the site.
      try {
        if (location.pathname === "/" && !location.hash && sessionStorage.getItem("tde-home-intro-seen") !== "1" && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.dataset.homeIntro = "boot";
          setTimeout(function () {
            if (document.documentElement.dataset.homeIntro === "boot") delete document.documentElement.dataset.homeIntro;
          }, 3000);
        }
      } catch (_) {}
    </script>
    <link rel="preload" href="/fonts/anton.ttf" as="font" type="font/ttf" crossorigin />
    <!--public-head:start-->
    <title>The Dance Exclusive — Dance Classes in Essex</title>
    <meta name="description" content="Commercial and street dance for children and adults across Essex. Find your class with The Dance Exclusive." />
    <meta name="robots" content="noindex,follow" />
    <!--public-head:end-->
    <meta name="author" content="The Dance Exclusive" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.thedanceexclusive.co.uk/media/tde-school.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.thedanceexclusive.co.uk/media/tde-school.jpg" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--public-state-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
